version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ganzhong-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ganzhong
      MYSQL_USER: ganzhong
      MYSQL_PASSWORD: ganzhong123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
